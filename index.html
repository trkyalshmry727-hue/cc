<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>محفظة RPMX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0b0d14;color:#fff;min-height:100vh;padding:18px 14px 40px;background-image:radial-gradient(circle at 20% 0%,#3a1060 0,transparent 45%),radial-gradient(circle at 100% 30%,#0d3b66 0,transparent 40%)}
h1{text-align:center;font-size:22px;margin-bottom:14px;letter-spacing:1px}
h1 span{color:#ffcc00}
.card{background:linear-gradient(135deg,#ff8a00,#e52e71);border-radius:22px;padding:22px;box-shadow:0 10px 30px #e52e7155;margin-bottom:18px;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff22;left:-50px;top:-60px}
.card small{opacity:.9;font-size:14px}
.bal{font-size:44px;font-weight:800;margin:6px 0}
.bal b{font-size:20px;font-weight:600}
.box{background:#161a26;border:1px solid #262c3d;border-radius:18px;padding:16px;margin-bottom:16px}
.box h2{font-size:17px;margin-bottom:12px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333a50;background:#0f121b;color:#fff;font-size:20px;text-align:center;letter-spacing:4px;outline:none}
input:focus{border-color:#ffcc00}
input.t{letter-spacing:0;font-size:16px;text-align:right;margin-bottom:10px}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:700;color:#000;background:#ffcc00;cursor:pointer}
button:active{transform:scale(.97)}
button.red{background:#ff4d6d;color:#fff}
.msg{margin-top:10px;text-align:center;font-size:15px;min-height:20px}
.ok{color:#3ddc84}.er{color:#ff6b6b}
.list div{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #222839;font-size:14px}
.list div:last-child{border:0}
.p{color:#3ddc84;font-weight:700}.m{color:#ff6b6b;font-weight:700}
.d{opacity:.55;font-size:12px}
.empty{opacity:.5;text-align:center;padding:10px}
.pop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
.pop.on{display:flex}
.pop div{background:#161a26;border-radius:22px;padding:30px;text-align:center;width:80%;max-width:320px;animation:z .35s}
.pop .big{font-size:46px;color:#ffcc00;font-weight:800}
@keyframes z{from{transform:scale(.5);opacity:0}}
</style>
</head>
<body>
<h1>محفظة <span>RPMX</span></h1>

<div class="card">
  <small>رصيدك الحالي</small>
  <div class="bal"><span id="bal">0</span> <b>ريال</b></div>
  <small id="cnt">الأكواد المستخدمة: 0</small>
</div>

<div class="box">
  <h2>🎁 أدخل الكود</h2>
  <input id="code" inputmode="numeric" maxlength="7" placeholder="٠٠٠٠٠٠٠">
  <button onclick="redeem()">شحن</button>
  <div class="msg" id="msg"></div>
</div>

<div class="box">
  <h2>🛒 اشتري عنصر</h2>
  <input class="t" id="item" placeholder="اسم العنصر (مثال: سيارة جديدة)">
  <input class="t" id="price" inputmode="numeric" placeholder="السعر بالريال">
  <button class="red" onclick="buy()">شراء</button>
  <div class="msg" id="msg2"></div>
</div>

<div class="box">
  <h2>📜 السجل</h2>
  <div class="list" id="log"></div>
</div>

<div class="pop" id="pop" onclick="this.classList.remove('on')"><div><div>تم الشحن 🎉</div><div class="big" id="popv"></div><div>ريال</div></div></div>

const SALT="cc-rpmx-2026",KEY="cc_wallet";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{balance:0,used:[],log:[]}}catch(e){return{balance:0,used:[],log:[]}}}
function save(w){try{localStorage.setItem(KEY,JSON.stringify(w))}catch(e){}}
let W=load();
const ar=n=>Number(n).toLocaleString('ar-SA');
function draw(){
  document.getElementById('bal').textContent=ar(W.balance);
  document.getElementById('cnt').textContent='الأكواد المستخدمة: '+ar(W.used.length);
  const l=document.getElementById('log');
  if(!W.log.length){l.innerHTML='<div class="empty">ما فيه عمليات للحين</div>';return}
  l.innerHTML=W.log.slice().reverse().map(x=>`<div><span>${x.t}<br><span class="d">${x.d}</span></span><span class="${x.a>0?'p':'m'}">${x.a>0?'+':'−'}${ar(Math.abs(x.a))}</span></div>`).join('');
}
async function sha(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  return sha256(s);
}
function now(){return new Date().toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'})}
function m(id,t,ok){const e=document.getElementById(id);e.textContent=t;e.className='msg '+(ok?'ok':'er')}
async function redeem(){
  const inp=document.getElementById('code');
  let c=inp.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
  if(c.length!==7)return m('msg','الكود لازم يكون ٧ أرقام',0);
  const h=await sha(SALT+c);
  if(!(h in H))return m('msg','❌ الكود غلط',0);
  if(W.used.includes(h))return m('msg','⚠️ هذا الكود مستخدم من قبل',0);
  const a=H[h];W.balance+=a;W.used.push(h);W.log.push({t:'شحن كود',a:a,d:now()});save(W);draw();
  inp.value='';m('msg','✅ انضاف '+ar(a)+' ريال',1);
  document.getElementById('popv').textContent=ar(a);document.getElementById('pop').classList.add('on');
  if(navigator.vibrate)navigator.vibrate(80);
}
function buy(){
  const n=document.getElementById('item').value.trim();
  const p=parseInt(document.getElementById('price').value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  if(!n)return m('msg2','اكتب اسم العنصر',0);
  if(!p||p<=0)return m('msg2','اكتب سعر صحيح',0);
  if(p>W.balance)return m('msg2','❌ رصيدك ما يكفي',0);
  W.balance-=p;W.log.push({t:'شراء: '+n,a:-p,d:now()});save(W);draw();
  document.getElementById('item').value='';document.getElementById('price').value='';
  m('msg2','✅ تم شراء '+n,1);
}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')redeem()});
/* احتياط للأجهزة القديمة */
function sha256(a){function r(n,x){return(x>>>n)|(x<<(32-n))}var K=[],H0=[],p=2,c=0;while(c<64){var q=1;for(var f=2;f*f<=p;f++)if(p%f==0){q=0;break}if(q){if(c<8)H0[c]=(Math.pow(p,.5)*4294967296)|0;K[c++]=(Math.pow(p,1/3)*4294967296)|0}p++}a=unescape(encodeURIComponent(a));var l=a.length*8,w=[];a+='\x80';while(a.length%64-56)a+='\x00';for(var i=0;i<a.length;i++)w[i>>2]|=a.charCodeAt(i)<<((3-i%4)*8);w[w.length]=(l/4294967296)|0;w[w.length]=l;var h=H0.slice();for(var j=0;j<w.length;j+=16){var W2=w.slice(j,j+16),o=h.slice();for(i=0;i<64;i++){if(i>15){var s0=r(7,W2[i-15])^r(18,W2[i-15])^(W2[i-15]>>>3),s1=r(17,W2[i-2])^r(19,W2[i-2])^(W2[i-2]>>>10);W2[i]=(W2[i-16]+s0+W2[i-7]+s1)|0}var e=o[4],t1=o[7]+(r(6,e)^r(11,e)^r(25,e))+((e&o[5])^(~e&o[6]))+K[i]+W2[i],A=o[0],t2=(r(2,A)^r(13,A)^r(22,A))+((A&o[1])^(A&o[2])^(o[1]&o[2]));o=[(t1+t2)|0].concat(o);o[4]=(o[4]+t1)|0;o.pop()}for(i=0;i<8;i++)h[i]=(h[i]+o[i])|0}return h.map(function(v){return('00000000'+(v>>>0).toString(16)).slice(-8)}).join('')}
draw();
